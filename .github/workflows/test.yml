name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # minimum from go.mod, and the latest release
        go: ["1.18", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: short fuzz
        if: matrix.go == 'stable'
        run: go test -run '^$' -fuzz FuzzB62RoundTrip -fuzztime 20s .
